<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Loom · 场景动画工作台</title>
<style>
:root{--bg:#11131a;--panel:#191c26;--line:#303545;--text:#edf1ff;--muted:#8d95ad;--accent:#77e1ba;--pink:#ff7aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#252a3e,#11131a 42%);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:#202433;color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}button:disabled{opacity:.4;cursor:default}.app{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#6a8cff);border-radius:10px;display:grid;place-items:center;color:#10151a;font-weight:800}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.actions{display:flex;gap:8px}.primary{background:var(--accent);color:#10231e;border-color:var(--accent);font-weight:700}.workspace{display:grid;grid-template-columns:230px minmax(450px,1fr) 250px;gap:16px}.panel{background:rgba(25,28,38,.94);border:1px solid var(--line);border-radius:14px;padding:15px}.panel h3{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool.active{border-color:var(--pink);color:var(--pink);background:#302333}.swatches{display:flex;flex-wrap:wrap;gap:9px}.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer}.sw.sel{border-color:white;box-shadow:0 0 0 2px var(--accent)}.range{width:100%;accent-color:var(--accent)}.center{display:flex;flex-direction:column;gap:12px;min-width:0}.canvasbox{background:#0c0e14;border:1px solid var(--line);border-radius:14px;padding:30px;display:grid;place-items:center;min-height:480px;position:relative}.canvaswrap{position:relative;image-rendering:pixelated;box-shadow:0 0 0 1px #3a4053,0 18px 60px #0008}.canvaswrap:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff11 1px,transparent 1px),linear-gradient(90deg,#ffffff11 1px,transparent 1px);background-size:calc(100% / 16) calc(100% / 16);pointer-events:none}.canvaswrap.gridoff:before{display:none}.canvas{display:block;image-rendering:pixelated;background:#252a3a}.onion{position:absolute;inset:0;opacity:.23;pointer-events:none}.emptyhint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none;text-align:center;padding:20px}
.scenebar{display:flex;align-items:center;gap:10px;padding:10px 12px}.scenetabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0}.tab{padding:7px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;white-space:nowrap;background:#141722}.tab.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.tab small{color:var(--muted);margin-left:5px}.sceneops{display:flex;gap:6px}.sceneops button{padding:6px 9px;font-size:12px}
.timeline{display:flex;flex-direction:column;gap:10px}.tlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.frames{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px;min-height:96px}.frame{min-width:70px;background:#10131c;border:1px solid var(--line);border-radius:9px;padding:5px;cursor:pointer;text-align:center}.frame.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.frame.inrange{border-top:2px solid var(--pink)}.frame canvas{width:100%;height:56px;image-rendering:pixelated}.frame .fdur{font-size:11px;color:var(--muted)}.frame.active .fdur{color:var(--accent)}.framesempty{color:var(--muted);font-size:12px;align-self:center;margin:auto}.controls label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}.controls input,.controls select{background:#10131b;border:1px solid var(--line);color:var(--text);padding:5px;border-radius:6px}.controls input[type=number]{width:60px}.layer{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid transparent;border-radius:8px;cursor:pointer}.layer.active{background:#252a39;border-color:var(--accent)}.layer span{color:var(--muted);font-size:12px}.field{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin:11px 0}.field input[type=text],.field select{width:120px;background:#10131b;border:1px solid var(--line);color:var(--text);padding:7px;border-radius:7px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.status{font-size:12px;color:var(--accent);min-height:18px}.kbd{border:1px solid var(--line);padding:2px 6px;border-radius:5px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;z-index:99}.overlay.show{display:grid}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:360px;box-shadow:0 24px 80px #000c}.dialog h3{margin:0 0 6px;font-size:15px}.dialog .sub{color:var(--muted);font-size:12px;margin-bottom:8px}.dialog .row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--muted);gap:10px}.dialog input,.dialog select{background:#10131b;border:1px solid var(--line);color:var(--text);padding:7px;border-radius:7px;width:110px}.dialog input[type=radio]{width:auto}.dialog .end{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:1000px){.workspace{grid-template-columns:190px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(max-width:700px){.app{padding:14px}.workspace{grid-template-columns:1fr}.left,.right{display:block}.canvasbox{min-height:360px;padding:15px}.actions button span{display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="mark">P</div><div><h1>Pixel Loom</h1><small>场景动画工作台 · 本地项目</small></div></div><div class="actions"><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="save" class="primary">保存项目</button><button id="exportBtn">导出图集</button></div></header>
<section class="workspace"><aside class="panel left"><h3>工具</h3><div class="toolgrid"><button class="tool active" data-tool="pencil">✦ 画笔</button><button class="tool" data-tool="eraser">⌫ 橡皮</button><button class="tool" data-tool="fill">◩ 填充</button><button class="tool" data-tool="picker">◉ 取色</button></div><h3 style="margin-top:25px">颜色</h3><div class="swatches" id="swatches"></div><input id="custom" type="color" value="#ff7aa8" style="width:100%;height:36px;margin-top:12px;background:#10131b;border:1px solid var(--line);border-radius:8px"><h3 style="margin-top:25px">画布</h3><div class="field"><label>缩放</label><input id="zoom" class="range" type="range" min="8" max="28" value="20"></div><div class="field"><label>网格</label><input id="grid" type="checkbox" checked></div><h3 style="margin-top:25px">精灵图</h3><button id="importBtn" style="width:100%">⇪ 导入精灵图</button><p class="hint" style="margin-top:10px">按行列或单元格网格拆分帧，导入为新场景。</p><p class="hint">点击像素绘制，按住拖动连续涂色。支持 ⌘/Ctrl + Z 撤销、⇧⌘/Ctrl + Z 重做。</p></aside>
<section class="center"><div class="panel scenebar"><div class="scenetabs" id="sceneTabs"></div><div class="sceneops"><button id="sceneAdd" title="新增场景">＋新增</button><button id="sceneDup" title="复制当前场景">⧉复制</button><button id="sceneLeft" title="左移当前场景">◀</button><button id="sceneRight" title="右移当前场景">▶</button><button id="sceneDel" title="移除当前场景">✕移除</button></div></div><div class="canvasbox"><div class="canvaswrap" id="canvaswrap"><canvas id="onion" class="onion" width="320" height="320"></canvas><canvas id="canvas" class="canvas" width="320" height="320"></canvas><div class="emptyhint" id="emptyHint" hidden>空场景<br>点击画布创建第一帧</div></div></div><div class="panel timeline"><div class="tlrow"><button id="addFrame" class="primary">＋ 新建帧</button><button id="dupFrame">复制</button><button id="delFrame">删除</button><div class="frames" id="frames"></div></div><div class="tlrow controls"><label>帧时长 <input id="dur" type="number" min="20" max="60000" step="10"> ms</label><button id="durAll">应用到全部帧</button><label>播放区间 <input id="rangeStart" type="number" min="1"> – <input id="rangeEnd" type="number" min="1"></label><label>循环 <select id="loopMode"><option value="loop">循环</option><option value="once">单次</option><option value="pingpong">往返</option></select></label></div></div><div class="status" id="status"></div></section>
<aside class="panel right"><h3>播放预览</h3><button id="play" class="primary" style="width:100%">▶ 播放动画</button><p class="hint" style="margin-top:8px">按当前场景的逐帧时长、播放区间与循环模式播放。</p><h3 style="margin-top:25px">洋葱皮</h3><div class="field"><label>显示前一帧</label><input id="onionToggle" type="checkbox"></div><div class="field"><label>透明度</label><input id="opacity" class="range" type="range" min="5" max="60" value="23"></div><h3 style="margin-top:25px">图层</h3><div id="layers"><div class="layer active"><b>主图层</b><span>可见</span></div><div class="layer"><b>阴影</b><span>可见</span></div></div><button id="addLayer" style="width:100%;margin-top:10px">＋ 添加图层</button><p class="hint" style="margin-top:25px">项目会自动保存至浏览器本地存储，刷新后结构、选择与播放设置完整恢复。</p></aside></section></main>
<input type="file" id="importFile" accept="image/*" hidden>
<div class="overlay" id="importModal"><div class="dialog"><h3>导入精灵图</h3><div class="sub" id="impInfo"></div><div class="row"><label>场景名称</label><input id="impName" type="text" style="width:170px"></div><div class="row"><label>拆分方式</label><select id="impMode"><option value="rc">按行列</option><option value="grid">按单元格网格</option></select></div><div class="row" id="impRcRow"><label>行 × 列</label><span><input id="impRows" type="number" min="1" value="1" style="width:60px"> × <input id="impCols" type="number" min="1" value="1" style="width:60px"></span></div><div class="row" id="impGridRow" hidden><label>单元格宽 × 高 (px)</label><span><input id="impCellW" type="number" min="1" value="16" style="width:60px"> × <input id="impCellH" type="number" min="1" value="16" style="width:60px"></span></div><div class="row"><label>每帧时长 (ms)</label><input id="impDur" type="number" min="20" max="60000" step="10" value="100"></div><div class="end"><button id="impCancel">取消</button><button id="impOk" class="primary">导入</button></div></div></div>
<div class="overlay" id="exportModal"><div class="dialog"><h3>导出帧图集</h3><div class="sub">将帧序列拼合为 PNG 精灵图集（透明背景）。</div><div class="row"><label><input type="radio" name="expMode" value="current" checked> 当前场景</label><span id="expCurrentInfo"></span></div><div class="row"><label><input type="radio" name="expMode" value="all"> 全部场景</label><span id="expAllInfo"></span></div><div class="row"><label><input type="radio" name="expMode" value="range"> 指定区间</label><span><input id="expFrom" type="number" min="1" style="width:60px"> – <input id="expTo" type="number" min="1" style="width:60px"></span></div><div class="row"><label>导出缩放</label><select id="expScale"><option value="1">1× (16px/帧)</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></div><div class="end"><button id="expCancel">取消</button><button id="expOk" class="primary">导出 PNG</button></div></div></div>
<script>
'use strict';
const N=16,MAXHIST=40,SAVE_KEY='pixelLoom';
const COLORS=['#ff7aa8','#77e1ba','#ffd166','#6a8cff','#b18cff','#ffffff','#11131a','#f97316'];
const LOOP_NAMES={loop:'循环',once:'单次',pingpong:'往返'};
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const blankFrame=()=>Array(N*N).fill('');

let state,history=[],future=[];
let tool='pencil',color=COLORS[0],drawing=false,strokePushed=false;
let playing=false,playTimer=null,playIdx=0,playDir=1;
let saveTimer=null,pendingImg=null;

/* ---------- 数据模型 ---------- */
const isCell=v=>typeof v==='string'&&(v===''||/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v));
function sanitizeFrame(f){const a=Array.isArray(f)?f.slice(0,N*N):[];while(a.length<N*N)a.push('');return a.map(v=>isCell(v)?v:'')}
function makeScene(name,frames,dur){frames=frames&&frames.length?frames.map(sanitizeFrame):[blankFrame()];return{id:'sc'+Math.random().toString(36).slice(2,9),name:name||'场景',frames,durations:frames.map(()=>dur||100),range:{start:0,end:frames.length-1},loop:'loop'}}
function defaultUi(){return{zoom:20,grid:true,onion:false,onionOpacity:23,tool:'pencil',color:COLORS[0]}}
function defaultState(){return{version:2,nextId:2,scenes:[makeScene('场景 1',[blankFrame()],100)],currentScene:0,currentFrame:0,ui:defaultUi()}}
function sanitizeScene(s,i){
  if(!s||typeof s!=='object')return null;
  const frames=(Array.isArray(s.frames)?s.frames:[]).map(sanitizeFrame);
  const durations=frames.map((_,j)=>{const d=Array.isArray(s.durations)?+s.durations[j]:NaN;return Number.isFinite(d)&&d>0?clamp(Math.round(d),20,60000):100});
  const sc={id:typeof s.id==='string'&&s.id?s.id:'sc'+i+Math.random().toString(36).slice(2,7),
    name:typeof s.name==='string'&&s.name.trim()?s.name.trim().slice(0,40):('场景 '+(i+1)),
    frames,durations,range:{start:0,end:0},loop:['loop','once','pingpong'].includes(s.loop)?s.loop:'loop'};
  const r=s.range&&typeof s.range==='object'?s.range:{};
  const hi=Math.max(0,frames.length-1);
  sc.range={start:clamp(Math.round(+r.start)||0,0,hi),end:clamp(Math.round(+r.end)||0,0,hi)};
  if(sc.range.start>sc.range.end){const t=sc.range.start;sc.range.start=sc.range.end;sc.range.end=t}
  return sc;
}
function sanitizeProject(p){
  const list=(Array.isArray(p.scenes)?p.scenes:[]).map(sanitizeScene).filter(Boolean);
  if(!list.length)list.push(makeScene('场景 1',[blankFrame()],100));
  return{version:2,nextId:Math.max(2,Math.round(+p.nextId)||2),scenes:list,
    currentScene:clamp(Math.round(+p.currentScene)||0,0,list.length-1),
    currentFrame:Math.max(0,Math.round(+p.currentFrame)||0),
    ui:Object.assign(defaultUi(),p.ui&&typeof p.ui==='object'?p.ui:{})};
}
function migrateLegacy(d){ // 旧版 {frames,fps} → 场景化结构
  const fps=clamp(+d.fps||8,1,24);
  let frames=(Array.isArray(d.frames)?d.frames:[]).map(sanitizeFrame);
  if(!frames.length)frames=[blankFrame()];
  const st=defaultState();
  st.scenes=[makeScene('场景 1',frames,Math.round(1000/fps))];
  return st;
}

/* ---------- 撤销 / 重做 ---------- */
const snap=()=>JSON.parse(JSON.stringify({scenes:state.scenes,currentScene:state.currentScene,currentFrame:state.currentFrame}));
function pushHistory(){history.push(snap());if(history.length>MAXHIST)history.shift();future=[]}
function applySnap(s){stopPlay();state.scenes=s.scenes;state.currentScene=clamp(s.currentScene,0,state.scenes.length-1);state.currentFrame=Math.max(0,s.currentFrame);renderAll();touch()}
function undo(){if(!history.length){setStatus('没有可撤销的操作');return}future.push(snap());applySnap(history.pop());setStatus('已撤销')}
function redo(){if(!future.length){setStatus('没有可重做的操作');return}history.push(snap());applySnap(future.pop());setStatus('已重做')}

/* ---------- 访问器 ---------- */
const S=()=>state.scenes[state.currentScene];
const F=()=>S().frames;
const cur=()=>F().length?clamp(state.currentFrame,0,F().length-1):-1; // 空场景为 -1

/* ---------- 持久化 ---------- */
function saveNow(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function touch(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveNow();setStatus('已自动保存 · '+new Date().toLocaleTimeString())},500)}
function loadProject(){
  state=defaultState();
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw==null)return'new';
  let d;try{d=JSON.parse(raw)}catch(e){return'corrupted'}
  if(d&&d.version===2){state=sanitizeProject(d);return'loaded'}
  if(d&&Array.isArray(d.frames)){pushHistory();state=migrateLegacy(d);saveNow();return'migrated'} // 迁移进入撤销历史
  return'corrupted';
}

/* ---------- 渲染 ---------- */
const canvas=$('#canvas'),ctx=canvas.getContext('2d'),oc=$('#onion'),octx=oc.getContext('2d');
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#202433';ctx.fillRect(0,0,canvas.width,canvas.height);
  const f=F(),i=cur(),cell=canvas.width/N;
  if(i>=0)f[i].forEach((v,j)=>{if(v){ctx.fillStyle=v;ctx.fillRect(j%N*cell,Math.floor(j/N)*cell,cell,cell)}});
  octx.clearRect(0,0,oc.width,oc.height);
  if(state.ui.onion&&i>0)f[i-1].forEach((v,j)=>{if(v){octx.fillStyle=v;octx.fillRect(j%N*cell,Math.floor(j/N)*cell,cell,cell)}});
  $('#emptyHint').hidden=f.length>0;
}
function renderScenes(){
  const el=$('#sceneTabs');el.innerHTML='';
  state.scenes.forEach((s,i)=>{
    const b=document.createElement('div');b.className='tab'+(i===state.currentScene?' active':'');
    b.innerHTML=`<span></span><small>${s.frames.length}帧 · ${LOOP_NAMES[s.loop]}</small>`;
    b.querySelector('span').textContent=s.name;
    b.title='双击重命名';
    b.onclick=()=>{if(i!==state.currentScene){stopPlay();state.currentScene=i;state.currentFrame=clamp(state.currentFrame,0,s.frames.length-1);renderAll();touch()}};
    b.ondblclick=()=>{const n=prompt('场景名称',s.name);if(n&&n.trim()&&n.trim()!==s.name){pushHistory();s.name=n.trim().slice(0,40);changed()}};
    el.append(b);
  });
}
function renderFrames(){
  const el=$('#frames');el.innerHTML='';
  const s=S();
  if(!s.frames.length){const d=document.createElement('div');d.className='framesempty';d.textContent='空场景 · 点击画布或「新建帧」开始';el.append(d);return}
  s.frames.forEach((f,i)=>{
    const b=document.createElement('div');b.className='frame'+(i===cur()?' active':'')+((i>=s.range.start&&i<=s.range.end)?' inrange':'');
    const x=document.createElement('canvas');x.width=x.height=N;const q=x.getContext('2d');
    q.fillStyle='#202433';q.fillRect(0,0,N,N);
    f.forEach((v,j)=>{if(v){q.fillStyle=v;q.fillRect(j%N,Math.floor(j/N),1,1)}});
    const lab=document.createElement('div');lab.className='fdur';lab.textContent=`#${i+1} · ${s.durations[i]}ms`;
    b.append(x,lab);
    b.onclick=()=>{state.currentFrame=i;draw();renderFrames();renderControls();touch()};
    el.append(b);
  });
}
function renderControls(){
  const s=S(),i=cur(),n=s.frames.length;
  $('#dur').value=i>=0?s.durations[i]:'';$('#dur').disabled=n===0;$('#durAll').disabled=n===0;$('#delFrame').disabled=n===0;$('#dupFrame').disabled=n===0;
  $('#rangeStart').value=n?s.range.start+1:0;$('#rangeEnd').value=n?s.range.end+1:0;
  $('#rangeStart').max=$('#rangeEnd').max=Math.max(1,n);
  $('#rangeStart').disabled=$('#rangeEnd').disabled=$('#loopMode').disabled=n===0;
  $('#loopMode').value=s.loop;
  $('#play').textContent=playing?'■ 停止预览':'▶ 播放动画';
}
function renderAll(){renderScenes();renderFrames();renderControls();draw()}
function changed(){renderAll();touch()}
function setStatus(m){$('#status').textContent=m}

/* ---------- 绘制工具 ---------- */
function flood(f,x,y,from,to){const st=[[x,y]];while(st.length){const p=st.pop(),cx=p[0],cy=p[1];if(cx<0||cx>=N||cy<0||cy>=N)continue;const k=cy*N+cx;if(f[k]!==from)continue;f[k]=to;st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}}
function applyToolAt(idx){const i=cur();if(i<0)return;const f=F()[i];
  if(tool==='picker'){const v=f[idx];if(v){color=v;state.ui.color=v;$('#custom').value=v;touch()}return}
  if(tool==='fill'){if(f[idx]===color)return;pushHistory();flood(f,idx%N,Math.floor(idx/N),f[idx],color);changed();return}
  f[idx]=tool==='eraser'?'':color;
}
function setPixel(e){
  const r=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N);
  if(x<0||x>=N||y<0||y>=N)return;
  const s=S();
  if(!s.frames.length){ // 空场景：点击画布创建第一帧（可撤销）
    if(tool==='picker')return;
    pushHistory();s.frames.push(blankFrame());s.durations.push(100);s.range={start:0,end:0};state.currentFrame=0;
    if(tool==='fill')flood(s.frames[0],x,y,'',color);
    else s.frames[0][y*N+x]=tool==='eraser'?'':color;
    changed();return;
  }
  const idx=y*N+x;
  if(tool==='picker'||tool==='fill'){applyToolAt(idx);draw();return}
  if(!strokePushed){pushHistory();strokePushed=true}
  applyToolAt(idx);draw();
}

/* ---------- 帧操作 ---------- */
function addFrame(){const s=S();pushHistory();const at=cur()+1,dur=s.durations[cur()]||100;s.frames.splice(at,0,blankFrame());s.durations.splice(at,0,dur);if(s.range.end>=at-1&&s.range.end===s.frames.length-2)s.range.end=s.frames.length-1;state.currentFrame=at;changed();setStatus('已新建帧 #'+(at+1))}
function dupFrame(){const s=S(),i=cur();if(i<0)return;pushHistory();s.frames.splice(i+1,0,s.frames[i].slice());s.durations.splice(i+1,0,s.durations[i]);if(s.range.end===s.frames.length-2)s.range.end=s.frames.length-1;state.currentFrame=i+1;changed();setStatus('已复制帧')}
function delFrame(){const s=S(),i=cur();if(i<0)return;pushHistory();s.frames.splice(i,1);s.durations.splice(i,1);const hi=Math.max(0,s.frames.length-1);s.range.start=clamp(s.range.start,0,hi);s.range.end=clamp(s.range.end,0,hi);if(!s.frames.length)s.range={start:0,end:0};state.currentFrame=clamp(i,0,s.frames.length-1);changed();setStatus(s.frames.length?'已删除帧':'已删除帧 · 场景为空')}

/* ---------- 场景操作 ---------- */
function sceneAdd(){pushHistory();const sc=makeScene('场景 '+(state.nextId++),[blankFrame()],100);state.scenes.splice(state.currentScene+1,0,sc);state.currentScene++;state.currentFrame=0;stopPlay();changed();setStatus('已新增场景「'+sc.name+'」')}
function sceneDup(){pushHistory();const s=S(),cp=JSON.parse(JSON.stringify(s));cp.id='sc'+Math.random().toString(36).slice(2,9);cp.name=(s.name+' 副本').slice(0,40);state.scenes.splice(state.currentScene+1,0,cp);state.currentScene++;stopPlay();changed();setStatus('已复制场景')}
function sceneMove(dir){const i=state.currentScene,j=i+dir;if(j<0||j>=state.scenes.length)return;pushHistory();const t=state.scenes[i];state.scenes[i]=state.scenes[j];state.scenes[j]=t;state.currentScene=j;changed();setStatus('已调整场景顺序')} // 选择跟随当前场景
function sceneDel(){pushHistory();const name=S().name;state.scenes.splice(state.currentScene,1);if(!state.scenes.length)state.scenes.push(makeScene('场景 1',[blankFrame()],100));state.currentScene=clamp(state.currentScene,0,state.scenes.length-1);state.currentFrame=0;stopPlay();changed();setStatus('已移除场景「'+name+'」')}

/* ---------- 播放 ---------- */
function stopPlay(){if(!playing)return;playing=false;clearTimeout(playTimer);renderControls()}
function play(){
  const s=S();
  if(!s.frames.length){setStatus('场景为空，无法播放');return}
  stopPlay();playing=true;playDir=1;
  playIdx=(cur()>=s.range.start&&cur()<=s.range.end)?cur():s.range.start;
  setStatus('播放中 · '+s.name+'（'+LOOP_NAMES[s.loop]+'）');
  scheduleNext();
}
function scheduleNext(){
  if(!playing)return;
  const s=S();
  if(!s||!s.frames.length){stopPlay();renderAll();return}
  playIdx=clamp(playIdx,s.range.start,s.range.end);
  state.currentFrame=playIdx;draw();renderFrames();
  playTimer=setTimeout(tick,clamp(s.durations[playIdx]||100,20,60000));
}
function tick(){
  if(!playing)return;
  const s=S();if(!s||!s.frames.length){stopPlay();renderAll();return}
  const{start,end}=s.range;
  if(s.loop==='loop'){playIdx=playIdx>=end?start:playIdx+1}
  else if(s.loop==='once'){if(playIdx>=end){stopPlay();renderAll();setStatus('播放完成');return}playIdx++}
  else{if(start<end){playIdx+=playDir;if(playIdx>=end){playIdx=end;playDir=-1}else if(playIdx<=start){playIdx=start;playDir=1}}}
  scheduleNext();
}

/* ---------- 精灵图导入 ---------- */
function rgbHex(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function sliceSprite(img,mode,rows,cols,cw,ch){
  if(mode==='grid'){cols=Math.max(1,Math.floor(img.width/Math.max(1,cw)));rows=Math.max(1,Math.floor(img.height/Math.max(1,ch)))}
  rows=Math.max(1,rows|0);cols=Math.max(1,cols|0);
  const src=document.createElement('canvas');src.width=img.width;src.height=img.height;
  const sx=src.getContext('2d');sx.drawImage(img,0,0);
  const cellW=img.width/cols,cellH=img.height/rows,frames=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ // 行优先，保持精灵图顺序
    const frame=blankFrame();
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const px=clamp(Math.floor(c*cellW+(x+.5)*cellW/N),0,img.width-1),py=clamp(Math.floor(r*cellH+(y+.5)*cellH/N),0,img.height-1);
      const d=sx.getImageData(px,py,1,1).data;
      frame[y*N+x]=d[3]<128?'':rgbHex(d[0],d[1],d[2]);
    }
    frames.push(frame);
  }
  return frames;
}
function doImport(){
  if(!pendingImg)return;
  const mode=$('#impMode').value,dur=clamp(+$('#impDur').value||100,20,60000);
  const frames=sliceSprite(pendingImg,mode,+$('#impRows').value,+$('#impCols').value,+$('#impCellW').value,+$('#impCellH').value);
  if(!frames.length){setStatus('未能从精灵图拆分出帧');return}
  pushHistory();
  const sc=makeScene($('#impName').value.trim()||'导入场景',frames,dur);
  state.scenes.splice(state.currentScene+1,0,sc);state.currentScene++;state.currentFrame=0;
  closeModal('#importModal');pendingImg=null;changed();
  setStatus(`已导入 ${frames.length} 帧为新场景「${sc.name}」（每帧 ${dur}ms）`);
}

/* ---------- 图集导出 ---------- */
function paintFrame(x,frame,ox,oy,scale){frame.forEach((v,j)=>{if(v){x.fillStyle=v;x.fillRect(ox+(j%N)*scale,oy+Math.floor(j/N)*scale,scale,scale)}})}
function buildAtlas(list,scale){
  if(!list.length)return null;
  const cols=Math.ceil(Math.sqrt(list.length)),rows=Math.ceil(list.length/cols);
  const cv=document.createElement('canvas');cv.width=cols*N*scale;cv.height=rows*N*scale;
  const x=cv.getContext('2d');
  list.forEach((f,i)=>paintFrame(x,f,(i%cols)*N*scale,Math.floor(i/cols)*N*scale,scale));
  return cv;
}
function buildAllAtlas(scale){
  const cols=Math.max(0,...state.scenes.map(s=>s.frames.length));
  if(!cols)return null;
  const rows=state.scenes.reduce((a,s)=>a+Math.ceil(s.frames.length/cols),0);
  if(!rows)return null;
  const cv=document.createElement('canvas');cv.width=cols*N*scale;cv.height=rows*N*scale;
  const x=cv.getContext('2d');let y=0;
  state.scenes.forEach(s=>{s.frames.forEach((f,i)=>paintFrame(x,f,(i%cols)*N*scale,(y+Math.floor(i/cols))*N*scale,scale));y+=Math.ceil(s.frames.length/cols)});
  return cv;
}
function download(cv,name){const a=document.createElement('a');a.download=name;a.href=cv.toDataURL('image/png');a.click()}
function doExport(){
  const mode=document.querySelector('input[name=expMode]:checked').value,scale=clamp(+$('#expScale').value||1,1,8);
  closeModal('#exportModal');
  let cv=null,name='';
  if(mode==='all'){
    cv=buildAllAtlas(scale);name='pixel-loom-all-scenes.png';
    if(!cv){setStatus('全部场景均为空，没有可导出的帧');return}
  }else{
    const s=S();
    let list=s.frames,tag='';
    if(mode==='range'){
      const a=clamp(Math.round(+$('#expFrom').value)||1,1,Math.max(1,s.frames.length))-1;
      const b=clamp(Math.round(+$('#expTo').value)||1,1,Math.max(1,s.frames.length))-1;
      list=s.frames.slice(Math.min(a,b),Math.max(a,b)+1);tag=`-${Math.min(a,b)+1}-${Math.max(a,b)+1}`;
    }
    cv=buildAtlas(list,scale);name=`pixel-loom-${s.name.replace(/[\\/:*?"<>|\s]+/g,'_')}${tag}.png`;
    if(!cv){setStatus('当前场景为空，没有可导出的帧');return}
  }
  download(cv,name);
  setStatus('已导出图集 · '+name);
}

/* ---------- 弹窗 ---------- */
function openModal(sel){$(sel).classList.add('show')}
function closeModal(sel){$(sel).classList.remove('show')}

/* ---------- 事件绑定 ---------- */
function bind(){
  canvas.addEventListener('pointerdown',e=>{drawing=true;strokePushed=false;setPixel(e)});
  canvas.addEventListener('pointermove',e=>{if(drawing)setPixel(e)});
  window.addEventListener('pointerup',()=>{if(drawing){drawing=false;strokePushed=false;renderFrames();touch()}});
  document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;state.ui.tool=tool;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');touch()});
  $('#swatches').innerHTML=COLORS.map(x=>`<button class="sw" style="background:${x}" data-c="${x}"></button>`).join('');
  document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;state.ui.color=color;$('#custom').value=color;touch()});
  $('#custom').oninput=e=>{color=e.target.value;state.ui.color=color;touch()};
  $('#zoom').oninput=e=>{applyZoom(+e.target.value);state.ui.zoom=+e.target.value;touch()};
  $('#grid').onchange=e=>{$('#canvaswrap').classList.toggle('gridoff',!e.target.checked);state.ui.grid=e.target.checked;touch()};
  $('#opacity').oninput=e=>{oc.style.opacity=e.target.value/100;state.ui.onionOpacity=+e.target.value;touch()};
  $('#onionToggle').onchange=e=>{state.ui.onion=e.target.checked;draw();touch()};
  $('#addFrame').onclick=addFrame;$('#dupFrame').onclick=dupFrame;$('#delFrame').onclick=delFrame;
  $('#sceneAdd').onclick=sceneAdd;$('#sceneDup').onclick=sceneDup;$('#sceneLeft').onclick=()=>sceneMove(-1);$('#sceneRight').onclick=()=>sceneMove(1);$('#sceneDel').onclick=sceneDel;
  $('#dur').onchange=e=>{const s=S(),i=cur();if(i<0)return;pushHistory();s.durations[i]=clamp(Math.round(+e.target.value)||100,20,60000);changed();setStatus(`帧 #${i+1} 时长 ${s.durations[i]}ms`)};
  $('#durAll').onclick=()=>{const s=S();if(!s.frames.length)return;pushHistory();const d=clamp(Math.round(+$('#dur').value)||100,20,60000);s.durations=s.durations.map(()=>d);changed();setStatus(`全部 ${s.frames.length} 帧时长已设为 ${d}ms`)};
  $('#rangeStart').onchange=e=>{const s=S();if(!s.frames.length)return;pushHistory();s.range.start=clamp(Math.round(+e.target.value)-1,0,s.frames.length-1);if(s.range.start>s.range.end)s.range.end=s.range.start;changed()};
  $('#rangeEnd').onchange=e=>{const s=S();if(!s.frames.length)return;pushHistory();s.range.end=clamp(Math.round(+e.target.value)-1,0,s.frames.length-1);if(s.range.end<s.range.start)s.range.start=s.range.end;changed()};
  $('#loopMode').onchange=e=>{pushHistory();S().loop=e.target.value;changed();setStatus('循环模式：'+LOOP_NAMES[S().loop])};
  $('#play').onclick=()=>{playing?stopPlay():play();renderControls()};
  $('#undo').onclick=undo;$('#redo').onclick=redo;
  window.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey;if(!mod)return;if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;const k=e.key.toLowerCase();if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}});
  $('#save').onclick=()=>{saveNow();setStatus('已保存到本地 · '+new Date().toLocaleTimeString())};
  $('#exportBtn').onclick=()=>{const s=S();$('#expCurrentInfo').textContent=`${s.name} · ${s.frames.length} 帧`;$('#expAllInfo').textContent=`${state.scenes.length} 个场景`;$('#expFrom').value=s.frames.length?1:0;$('#expTo').value=s.frames.length;openModal('#exportModal')};
  $('#expCancel').onclick=()=>closeModal('#exportModal');$('#expOk').onclick=doExport;
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=e=>{const file=e.target.files[0];e.target.value='';if(!file)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{pendingImg=img;$('#impName').value=file.name.replace(/\.\w+$/,'').slice(0,40)||'导入场景';$('#impInfo').textContent=`${file.name} · ${img.width}×${img.height}px`;openModal('#importModal')};img.onerror=()=>setStatus('图片加载失败');img.src=rd.result};rd.readAsDataURL(file)};
  $('#impMode').onchange=e=>{$('#impRcRow').hidden=e.target.value!=='rc';$('#impGridRow').hidden=e.target.value!=='grid'};
  $('#impCancel').onclick=()=>{closeModal('#importModal');pendingImg=null};$('#impOk').onclick=doImport;
  document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));
  $('#addLayer').onclick=()=>{const n=document.querySelectorAll('.layer').length+1,d=document.createElement('div');d.className='layer';d.innerHTML=`<b>图层 ${n}</b><span>可见</span>`;$('#layers').append(d)};
}
function applyZoom(z){const px=z*N+'px';canvas.style.width=canvas.style.height=px;oc.style.width=oc.style.height=px;$('#canvaswrap').style.width=$('#canvaswrap').style.height=px}
function applyUi(){
  state.ui.zoom=clamp(+state.ui.zoom||20,8,28);state.ui.onionOpacity=clamp(+state.ui.onionOpacity||23,5,60);
  if(!['pencil','eraser','fill','picker'].includes(state.ui.tool))state.ui.tool='pencil';
  if(typeof state.ui.color!=='string'||!/^#[0-9a-fA-F]{6}$/.test(state.ui.color))state.ui.color=COLORS[0];
  tool=state.ui.tool;color=state.ui.color;
  document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x.dataset.tool===tool));
  $('#custom').value=color;$('#zoom').value=state.ui.zoom;applyZoom(state.ui.zoom);
  $('#grid').checked=state.ui.grid;$('#canvaswrap').classList.toggle('gridoff',!state.ui.grid);
  $('#onionToggle').checked=state.ui.onion;$('#opacity').value=state.ui.onionOpacity;oc.style.opacity=state.ui.onionOpacity/100;
}

/* ---------- 启动 ---------- */
bind();
const boot=loadProject();
applyUi();renderAll();
setStatus(boot==='migrated'?'已自动迁移旧版项目（可撤销）':boot==='corrupted'?'存档损坏或格式不识别，已重置为新项目':boot==='loaded'?'已载入本地项目':'新项目就绪');
window.__PL__={get state(){return state},get history(){return history},get future(){return future},save:saveNow};
</script></body></html>
